name: Build sGram APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # На раннере ~14 ГБ свободно, а сабмодули + NDK + сборка нативки занимают больше
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make ninja-build g++

      - name: Build APK (arm64-v8a, debug)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug -Pabis=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sGram-arm64-v8a-${{ github.sha }}
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          retention-days: 7
